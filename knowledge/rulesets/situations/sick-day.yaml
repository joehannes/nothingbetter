id: situation.sick_day
version: 1
description: User signals illness or recovery; care mode.
when:
  any:
    - { regex: [ { var: brief.text }, "(?i)\\b(sick|flu|cold|fever|recovering|not feeling well|enfermo|resfriado|gripe)\\b" ] }
    - { "==": [ { var: brief.mood }, unwell ] }
effects:
  dials_preset: { urgency: 50, inspiration: 15, directness: 65, scenic: 20, health_emphasis: 75 }
  faculties:
    enable: [safety, context, nutrition, natural_medicine, palate, logistics]
    disable: [inspiration, value]
  safety:
    red_flag_screen: true          # fever > 3 days, breathing trouble, dehydration → suggest clinician
  weights: { easy_to_digest: 1.5, warming: 1.2, comfort: 1.3, novelty: 0.1 }
  tone: care
  extras:
    suggest_if_enabled: [ginger_tea, honey, soup_broth, electrolyte_drink]
  ui: { lane: guided, max_options: 3, no_upsell: true }
priority: 70
